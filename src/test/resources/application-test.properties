# ─── Perfil de testing ───────────────────────────────────────────────────────
# Datasource desactivado para tests unitarios (se usan mocks con Mockito)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Schema del programa en tests
spring.jpa.properties.hibernate.default_schema=ing_sistemas

# Mail: no enviar correos en tests
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
email.fake.destination=fake@test.com
sigha.url.access=http://localhost:4200

# Logging silencioso en tests
logging.level.root=WARN
logging.level.judamov=WARN
