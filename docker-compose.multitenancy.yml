version: '3.8'

services:
  # Backend para Ingeniería Biomédica
  backend-biomedica:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigha-backend-biomedica-unificado
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sigha-db-preprod:5432/sigha
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: clave123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ing_biomedica
      APP_SECRET_KEY: SIPOH2025THEBEST!
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: sigha.notifications@gmail.com
      SPRING_MAIL_PASSWORD: hbkhhjqihudzcakl
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      EMAIL_FAKE_DESTINATION: sigha.notifications@gmail.com
      SPRING_JACKSON_TIME_ZONE: America/Bogota
      SIGHA_URL_ACCESS: ${SIGHA_URL_ACCESS:-http://localhost}
    restart: unless-stopped
    networks:
      - sigha-network

