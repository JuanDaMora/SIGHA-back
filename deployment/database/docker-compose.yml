name: ${NAME}

services:
  db:
    image: postgres:15
    container_name: sigha-db-preprod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - sigha_data_preprod:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sigha_data_preprod:

networks:
  default:
    external: true
    name: sigha-preprod

